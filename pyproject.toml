[project]
name = "jkp-factor-replication"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib==3.10.6",
  "numpy==2.3.3",
  "polars==1.34.0",
  "wrds==3.4.0",
  "pandas==2.2.3",
  "pyarrow==21.0.0",
  # Matplotlib 3.10 uses parser APIs deprecated in pyparsing 3.3+.
  "pyparsing==3.2.5",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.5"]

[tool.uv]
required-version = "==0.12.7"
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
include = ["*.py", "*.pyi", "pyproject.toml"]
extend-exclude = ["data", "plots", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
